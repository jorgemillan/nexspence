# VirtualService on a Gateway that already exists. The chart does not
# create a Gateway CR. gatewaySelector is unused in this mode.
#
# helm install nexspence deploy/helm/nexspence \
#   -f values-examples/istio-existing-gateway.yaml

exposure:
  type: istioGateway
  hosts:
    - host: nexspence.example.com
  istioGateway:
    existingGateway: istio-system/istio-ingressgateway
    timeout: "300s"

config:
  baseURL: "https://nexspence.example.com"
